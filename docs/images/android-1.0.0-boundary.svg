<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">文節を直して、欲しい候補を選ぶ</title>
<desc id="desc">に、だいに分かれた読みをShiftと右矢印でにだいに広げて荷台を選ぶ。英語と判定されたcameraもShiftと左右矢印で日本語のカメラへ直す。</desc>
<rect width="960" height="340" rx="20" fill="#f4f7fb"/>
<g font-family="Yu Gothic, Noto Sans JP, sans-serif" fill="#17324d">
<text x="36" y="49" font-size="25" font-weight="bold">打ち直す前に、変換の区切りを直す</text>
<g font-size="27" text-anchor="middle">
<rect x="36" y="80" width="238" height="73" rx="12" fill="white" stroke="#cad7e4"/>
<text x="155" y="126">に｜だい</text>
<rect x="361" y="80" width="238" height="73" rx="12" fill="white" stroke="#cad7e4"/>
<text x="480" y="126">にだい</text>
<rect x="686" y="80" width="238" height="73" rx="12" fill="#dceeff" stroke="#6d9bc5"/>
<text x="805" y="126" font-weight="bold">荷台</text>
<text x="317" y="125">→</text><text x="642" y="125">→</text>
</g>
<g font-size="16" text-anchor="middle"><text x="317" y="181">Shift＋右</text><text x="642" y="181">候補をタップ</text></g>
<path d="M36 206H924" stroke="#cad7e4"/>
<text x="36" y="239" font-size="18">英語と判定された入力も、日本語へ</text>
<text x="92" y="291" font-size="27">camera</text><text x="300" y="289" font-size="18">→　Shift＋左・右　→</text>
<text x="628" y="291" font-size="27" font-weight="bold">カメラ</text>
</g></svg>