name: Android prototype
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MOZC_REVISION: 60fe4012e5eaa26805dbbb8e5548cbe6db4aaf98
jobs:
  mozc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore built engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: android-mozc-60fe4012e5eaa26805dbbb8e5548cbe6db4aaf98-v1
      - name: Build OSS Mozc and dictionary
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/google/mozc.git mozc
          git -C mozc checkout "$MOZC_REVISION"
          curl --fail --location https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o /tmp/bazelisk
          chmod +x /tmp/bazelisk
          cd mozc/src
          python3 build_tools/update_deps.py
          /tmp/bazelisk build --config oss_linux --config release_build //data_manager/oss:mozc.data
          dictionary=$(realpath bazel-bin/data_manager/oss/mozc.data)
          /tmp/bazelisk build --config oss_android --config release_build //android/jni:mozc.arm64 //android/jni:mozc.x86_64
          mkdir -p ../../engine/Native/arm64-v8a ../../engine/Native/x86_64 ../../engine/Assets
          arm64=$(/tmp/bazelisk cquery --config oss_android --config release_build //android/jni:mozc.arm64 --output=files | tail -n 1)
          x64=$(/tmp/bazelisk cquery --config oss_android --config release_build //android/jni:mozc.x86_64 --output=files | tail -n 1)
          cp "$arm64" ../../engine/Native/arm64-v8a/libmozc.so
          cp "$x64" ../../engine/Native/x86_64/libmozc.so
          cp "$dictionary" ../../engine/Assets/mozc.data
          external=$(/tmp/bazelisk info output_base)/external
          python3 ../../android/tools/collect_notices.py ../../engine/Assets/THIRD_PARTY_NOTICES.txt .. "$external"
      - uses: actions/upload-artifact@v4
        with:
          name: android-mozc-engine
          path: engine
          if-no-files-found: error
  apk:
    needs: mozc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android-mozc-engine
          path: android/Meltype.Android
      - name: Install Android workload
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json
      - name: Test input and mode toggle
        run: dotnet run --project android/Meltype.Android.Tests
      - name: Install build dependencies
        run: dotnet build android/Meltype.Android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: Build APK
        run: |
          python3 android/tools/collect_notices.py /tmp/dotnet-notices.txt "$DOTNET_ROOT/packs"
          cat /tmp/dotnet-notices.txt >> android/Meltype.Android/Assets/THIRD_PARTY_NOTICES.txt
          dotnet build android/Meltype.Android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          mkdir -p android-distribution
          cp android/Meltype.Android/bin/Release/net10.0-android/*-Signed.apk android-distribution/Meltype-Android-prototype.apk
          cp LICENSE docs/ANDROID_PROTOTYPE.md android/Meltype.Android/Assets/THIRD_PARTY_NOTICES.txt android-distribution/
          git rev-parse HEAD > android-distribution/SOURCE_VERSION.txt
          git archive --format=zip --output=android-distribution/corresponding-source.zip HEAD
          cd android-distribution
          sha256sum Meltype-Android-prototype.apk > Meltype-Android-prototype.apk.sha256
      - name: Test JNI and editor on Android
        timeout-minutes: 15
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          export PATH="$(dirname "$sdkmanager"):$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/meltype-android-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name meltype-test --path "$ANDROID_AVD_HOME/meltype-test.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          test -f "$ANDROID_AVD_HOME/meltype-test.ini"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd meltype-test -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot >/tmp/meltype-emulator.log 2>&1 &
          emulator_pid=$!
          sleep 5
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat /tmp/meltype-emulator.log; exit 1; fi
          if ! timeout 180 adb wait-for-device; then cat /tmp/meltype-emulator.log; exit 1; fi
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          for attempt in $(seq 1 5); do
            if adb root; then break; fi
            sleep 2
            timeout 60 adb wait-for-device
          done
          timeout 60 adb wait-for-device
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb install android-distribution/Meltype-Android-prototype.apk
          adb shell am start -n jp.aonesenbongi.meltype/jp.aonesenbongi.meltype.MainActivity --ez selftest true
          for attempt in $(seq 1 60); do
            if adb shell cat /data/user/0/jp.aonesenbongi.meltype/files/selftest.txt > android-distribution/ANDROID_TEST_RESULT.txt 2>/dev/null; then break; fi
            sleep 2
          done
          adb logcat -d > android-distribution/ANDROID_LOGCAT.txt
          cat android-distribution/ANDROID_TEST_RESULT.txt
          grep -q '^PASS:' android-distribution/ANDROID_TEST_RESULT.txt
          python3 android/tools/test_keyboard_ui.py android-distribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meltype-Android-screens
          path: |
            android-distribution/*.png
            android-distribution/*TEST_RESULT.txt
            android-distribution/ANDROID_UI_LOGCAT.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meltype-Android-prototype
          path: android-distribution
          if-no-files-found: error
