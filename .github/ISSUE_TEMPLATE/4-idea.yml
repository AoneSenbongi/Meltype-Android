name: 改善・機能の要望
description: キーボードの操作・表示・設定など、改善してほしいことや追加してほしい機能
title: "[改善要望] "
labels: ["提案"]
body:
  - type: markdown
    attributes:
      value: |
        Meltype Androidへの改善要望をお寄せください。操作や表示の小さな改善、新しい機能の要望もこちらで受け付けます。

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何が不便か
      placeholder: 候補欄の文字が小さく、候補を選びにくい
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい
      placeholder: 候補欄の文字サイズを設定で変更できるようにしてほしい
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 端末・Androidのバージョン（分かれば）
      placeholder: Pixel 8 / Android 15

  - type: input
    id: version
    attributes:
      label: Meltype Androidのバージョン（分かれば）
      placeholder: 1.0.0
